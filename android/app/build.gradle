plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Helper to resolve env vars from: 1) System.env / CI secrets, 2) Root .env, 3) android/local.properties
def getAppEnv(String key, String fallback = "") {
    def sysVal = System.getenv(key)
    if (sysVal != null && !sysVal.trim().isEmpty()) {
        return sysVal.trim()
    }
    def altKey = key.startsWith("VITE_") ? key.substring(5) : "VITE_" + key
    def altSysVal = System.getenv(altKey)
    if (altSysVal != null && !altSysVal.trim().isEmpty()) {
        return altSysVal.trim()
    }

    def envFile = rootProject.file("../.env")
    if (envFile.exists()) {
        def envProps = new Properties()
        try {
            envFile.withInputStream { envProps.load(it) }
            if (envProps.containsKey(key) && !envProps.getProperty(key).trim().isEmpty()) {
                return envProps.getProperty(key).trim()
            }
            if (envProps.containsKey(altKey) && !envProps.getProperty(altKey).trim().isEmpty()) {
                return envProps.getProperty(altKey).trim()
            }
        } catch (Exception ignored) {}
    }

    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        def localProps = new Properties()
        try {
            localPropsFile.withInputStream { localProps.load(it) }
            if (localProps.containsKey(key) && !localProps.getProperty(key).trim().isEmpty()) {
                return localProps.getProperty(key).trim()
            }
            if (localProps.containsKey(altKey) && !localProps.getProperty(altKey).trim().isEmpty()) {
                return localProps.getProperty(altKey).trim()
            }
        } catch (Exception ignored) {}
    }

    return fallback
}

android {
    namespace 'com.safarnama.travel'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.safarnama.travel"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // Read Environment Variables seamlessly from root .env or local.properties or CI secrets
        def supabaseUrl = getAppEnv("VITE_SUPABASE_URL", "https://your-project.supabase.co")
        def supabaseKey = getAppEnv("VITE_SUPABASE_ANON_KEY", "your-anon-key")
        def r2PublicUrl = getAppEnv("VITE_CLOUDFLARE_R2_PUBLIC_URL", "https://media.safarnama.travel")
        def googleMapsKey = getAppEnv("VITE_GOOGLE_MAPS_API_KEY", "AIzaSyPlaceholderSafarnamaMapsKey")

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseKey}\""
        buildConfigField "String", "R2_PUBLIC_URL", "\"${r2PublicUrl}\""
        buildConfigField "String", "GOOGLE_MAPS_KEY", "\"${googleMapsKey}\""

        // Inject Google Maps API Key directly into AndroidManifest.xml
        resValue "string", "google_maps_key", googleMapsKey
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-opt-in=androidx.media3.common.util.UnstableApi"
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // AndroidX & UI
    implementation "androidx.core:core-ktx:$rootProject.ext.androidXCoreVersion"
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidXAppCompatVersion"
    implementation "com.google.android.material:material:$rootProject.ext.materialVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.ext.constraintLayoutVersion"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.viewpager2:viewpager2:$rootProject.ext.viewPager2Version"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$rootProject.ext.navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$rootProject.ext.navigationVersion"

    // Lifecycle & ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.ext.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$rootProject.ext.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleVersion"

    // Coil Image Loading
    implementation "io.coil-kt:coil:$rootProject.ext.coilVersion"

    // Media3 / ExoPlayer for Reels
    implementation "androidx.media3:media3-exoplayer:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-ui:$rootProject.ext.media3Version"
    implementation "androidx.media3:media3-common:$rootProject.ext.media3Version"

    // Google Maps & Location
    implementation "com.google.android.gms:play-services-maps:$rootProject.ext.playServicesMapsVersion"
    implementation "com.google.android.gms:play-services-location:$rootProject.ext.playServicesLocationVersion"

    // Networking (OkHttp) & Coroutines
    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$rootProject.ext.okhttpVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.ext.coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.coroutinesVersion"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
