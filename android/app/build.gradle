plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def webRoot = rootProject.file('..')
def bundledWeb = layout.buildDirectory.dir('generated/safarnamaWebAssets')
def bundleWebForAndroid = tasks.register('bundleWebForAndroid', Exec) {
    description = 'Builds the shared SafarNama interface for offline use inside the APK'
    workingDir webRoot
    def vite = new File(webRoot, 'node_modules/vite/bin/vite.js')
    inputs.files(fileTree(webRoot) {
        include 'src/**', 'public/**', 'index.html', 'vite.config.ts', 'package*.json', '.env*'
    })
    inputs.property('publicConfig', [
        'VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY', 'VITE_GOOGLE_MAPS_API_KEY',
        'VITE_ANDROID_GOOGLE_MAPS_API_KEY', 'VITE_CLOUDFLARE_R2_PUBLIC_URL', 'VITE_R2_PRESIGN_ENDPOINT', 'VITE_API_URL'
    ].collectEntries { key -> [(key): providers.environmentVariable(key).orElse('').get()] })
    outputs.dir(bundledWeb)
    commandLine 'node', vite.absolutePath, 'build', '--mode', 'android', '--target', 'chrome109',
        '--outDir', bundledWeb.get().dir('web').asFile.absolutePath, '--emptyOutDir'
    doFirst {
        if (!vite.isFile()) throw new GradleException('Run npm ci in the repository root before building Android.')
    }
}

android {
    sourceSets.main.assets.srcDir(bundledWeb)
    namespace 'com.safarnama.travel'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.safarnama.travel"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [appLabel: '@string/app_name', authScheme: 'safarnama']
        buildConfigField "String", "AUTH_CALLBACK_SCHEME", '"safarnama"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            manifestPlaceholders = [appLabel: 'SafarNama Preview', authScheme: 'safarnama-preview']
            buildConfigField "String", "AUTH_CALLBACK_SCHEME", '"safarnama-preview"'
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.named('preBuild') { dependsOn(bundleWebForAndroid) }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation "androidx.core:core-ktx:$rootProject.ext.androidXCoreVersion"
    implementation "androidx.appcompat:appcompat:$rootProject.ext.androidXAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$rootProject.ext.coreSplashScreenVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$rootProject.ext.coroutinesVersion"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
