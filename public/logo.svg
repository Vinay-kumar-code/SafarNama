<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="logoBg" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#1B152B" />
      <stop offset="45%" stop-color="#0E0F18" />
      <stop offset="100%" stop-color="#06070B" />
    </radialGradient>

    <!-- Canvas Border Gradient -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E1B" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#FF3366" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FFB300" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FF9800" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0" />
    </radialGradient>

    <!-- Location Pin Multi-Stop Sunset Saffron-Coral Gradient -->
    <linearGradient id="pinGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="22%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="78%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Pin Rim Light Gradient -->
    <linearGradient id="pinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FFD54F" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FF5252" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.7" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="25%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Stamp Rings Gradient -->
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <!-- Lens Backdrop -->
    <radialGradient id="lensBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1526" />
      <stop offset="65%" stop-color="#0B0C12" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>

    <!-- Facet Gradients for 3D Compass Rose -->
    <linearGradient id="facetNLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF176" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>
    <linearGradient id="facetNDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="55%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>

    <linearGradient id="facetELight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="facetEDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="60%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <linearGradient id="facetSLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>
    <linearGradient id="facetSDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <linearGradient id="facetWLight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="facetWDark" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>

    <!-- Filters for Luxury Instagram Glow & Shadows -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>

    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#FF2E63" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas (Instagram Modern Aesthetic) -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="2.5" />

  <!-- 2. Ambient Atmosphere Radial Glow -->
  <circle cx="256" cy="236" r="165" fill="url(#ambientGlow)" filter="url(#softGlow)" />

  <!-- 3. Travel Journal Stamp Rings & Passport Notches -->
  <!-- Outer Perforated Passport Stamp Ring -->
  <circle cx="256" cy="236" r="184" fill="none" stroke="url(#stampGrad)" stroke-width="2.2" stroke-dasharray="4 6" opacity="0.55" />
  <!-- Inner Fine Guideline Ring -->
  <circle cx="256" cy="236" r="168" fill="none" stroke="url(#logoGold)" stroke-width="1.2" opacity="0.3" />

  <!-- Travel Journal Page Curves (Wings flanking the emblem) -->
  <path d="M 132 236 C 132 152 184 102 256 102" fill="none" stroke="url(#stampGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />
  <path d="M 380 236 C 380 152 328 102 256 102" fill="none" stroke="url(#stampGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />
  <!-- Journal Stitches -->
  <path d="M 148 236 C 148 168 190 122 256 122" fill="none" stroke="url(#logoGold)" stroke-width="1" stroke-dasharray="3 4" opacity="0.25" />
  <path d="M 364 236 C 364 168 322 122 256 122" fill="none" stroke="url(#logoGold)" stroke-width="1" stroke-dasharray="3 4" opacity="0.25" />

  <!-- Tilted Globe / Map Coordinate Orbit -->
  <ellipse cx="256" cy="236" rx="186" ry="68" transform="rotate(-24 256 236)" fill="none" stroke="url(#logoGold)" stroke-width="1.4" stroke-dasharray="5 7" opacity="0.35" />

  <!-- Cardinal Compass Diamond Markers on Outer Stamp Ring -->
  <!-- North Diamond -->
  <polygon points="256,44 262,52 256,60 250,52" fill="url(#logoGold)" />
  <!-- South Diamond -->
  <polygon points="256,412 262,420 256,428 250,420" fill="#FF4458" />
  <!-- East Diamond -->
  <polygon points="432,236 440,230 448,236 440,242" fill="url(#logoGold)" />
  <!-- West Diamond -->
  <polygon points="64,236 72,230 80,236 72,242" fill="url(#logoGold)" />

  <!-- Diagonal Compass Coordinates (NE, SE, SW, NW dots) -->
  <circle cx="378" cy="122" r="3" fill="#FFE082" opacity="0.6" />
  <circle cx="134" cy="122" r="3" fill="#FFE082" opacity="0.6" />
  <circle cx="378" cy="350" r="3" fill="#FF5252" opacity="0.6" />
  <circle cx="134" cy="350" r="3" fill="#FF5252" opacity="0.6" />

  <!-- 4. Location Pin Teardrop Silhouette -->
  <g filter="url(#pinShadow)">
    <path d="M 256 124 C 306.8 124 348 165.2 348 216 C 348 276 290 350 256 404 C 222 350 164 276 164 216 C 164 165.2 205.2 124 256 124 Z" 
          fill="url(#pinGrad)" />
    <!-- Pin Rim Light -->
    <path d="M 256 124 C 306.8 124 348 165.2 348 216 C 348 276 290 350 256 404 C 222 350 164 276 164 216 C 164 165.2 205.2 124 256 124 Z" 
          fill="none" stroke="url(#pinRim)" stroke-width="2" />
  </g>

  <!-- Location Coordinate Anchor Ripple below tip -->
  <ellipse cx="256" cy="426" rx="36" ry="9" fill="#FF3366" opacity="0.2" filter="url(#softGlow)" />
  <ellipse cx="256" cy="426" rx="22" ry="5.5" fill="none" stroke="url(#logoGold)" stroke-width="1.2" opacity="0.5" />
  <circle cx="256" cy="426" r="3" fill="url(#logoGold)" filter="url(#coreGlow)" />

  <!-- 5. Inner Aperture & Travel Lens -->
  <circle cx="256" cy="214" r="66" fill="url(#lensBg)" stroke="url(#logoGold)" stroke-width="3" />
  <circle cx="256" cy="214" r="58" fill="none" stroke="url(#stampGrad)" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.75" />

  <!-- 6. 8-Point Faceted Geometric Compass Rose -->
  <!-- Secondary 4 Diagonal Points (NE, SE, SW, NW) -->
  <!-- NE Point -->
  <polygon points="256,214 276,194 266,204" fill="url(#facetNLight)" opacity="0.9" />
  <polygon points="256,214 276,194 268,212" fill="url(#facetNDark)" opacity="0.8" />
  <!-- SE Point -->
  <polygon points="256,214 276,234 268,216" fill="url(#facetELight)" opacity="0.9" />
  <polygon points="256,214 276,234 266,224" fill="url(#facetEDark)" opacity="0.8" />
  <!-- SW Point -->
  <polygon points="256,214 236,234 246,224" fill="url(#facetSLight)" opacity="0.9" />
  <polygon points="256,214 236,234 244,216" fill="url(#facetSDark)" opacity="0.8" />
  <!-- NW Point -->
  <polygon points="256,214 236,194 244,212" fill="url(#facetWLight)" opacity="0.9" />
  <polygon points="256,214 236,194 246,204" fill="url(#facetWDark)" opacity="0.8" />

  <!-- Primary 4 Cardinal Points (North, South, East, West) -->
  <!-- North Point (Piercing upwards towards true North) -->
  <polygon points="256,214 256,164 248,214" fill="url(#facetNLight)" />
  <polygon points="256,214 256,164 264,214" fill="url(#facetNDark)" />

  <!-- South Point -->
  <polygon points="256,214 256,264 264,214" fill="url(#facetSLight)" />
  <polygon points="256,214 256,264 248,214" fill="url(#facetSDark)" />

  <!-- East Point -->
  <polygon points="256,214 306,214 256,206" fill="url(#facetELight)" />
  <polygon points="256,214 306,214 256,222" fill="url(#facetEDark)" />

  <!-- West Point -->
  <polygon points="256,214 206,214 256,222" fill="url(#facetWLight)" />
  <polygon points="256,214 206,214 256,206" fill="url(#facetWDark)" />

  <!-- 7. Central Compass Jewel Pivot -->
  <circle cx="256" cy="214" r="11" fill="url(#logoGold)" />
  <circle cx="256" cy="214" r="6.5" fill="#FFFDF2" />
  <circle cx="256" cy="214" r="3.2" fill="#FF3366" filter="url(#coreGlow)" />
</svg>
