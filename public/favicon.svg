<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181326" />
      <stop offset="50%" stop-color="#0E0F17" />
      <stop offset="100%" stop-color="#07080E" />
    </linearGradient>

    <!-- Pin Vibrant Saffron-Coral-Gold Gradient -->
    <linearGradient id="favPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="30%" stop-color="#FF5722" />
      <stop offset="70%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Facet Lighting -->
    <linearGradient id="favNorthLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>
    <linearGradient id="favNorthDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#DD2C00" />
    </linearGradient>
    <linearGradient id="favEastLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="favEastDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <linearGradient id="favSouthLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>
    <linearGradient id="favSouthDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="favWestLight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="favWestDark" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>

    <!-- Subtle Outer Border -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF4081" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Squircle Canvas with Subtle Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="1.2" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="27" r="18" fill="#FF5722" opacity="0.2" />

  <!-- Travel Stamp Notches (Cardinal ticks) -->
  <circle cx="32" cy="28" r="23" fill="none" stroke="#FF9800" stroke-width="0.8" stroke-dasharray="1.5 3" opacity="0.4" />
  <circle cx="32" cy="28" r="26" fill="none" stroke="#FFD54F" stroke-width="0.6" stroke-dasharray="0.5 4" opacity="0.3" />

  <!-- Location Pin Silhouette -->
  <path d="M 32 9 C 42.5 9 51 17.5 51 28 C 51 37.5 41 47 32 55.5 C 23 47 13 37.5 13 28 C 13 17.5 21.5 9 32 9 Z" 
        fill="url(#favPin)" />

  <!-- Pin Rim Highlight -->
  <path d="M 32 9 C 42.5 9 51 17.5 51 28 C 51 37.5 41 47 32 55.5 C 23 47 13 37.5 13 28 C 13 17.5 21.5 9 32 9 Z" 
        fill="none" stroke="url(#favGold)" stroke-width="0.8" opacity="0.6" />

  <!-- Coordinate Pulse Dot under Pin Tip -->
  <ellipse cx="32" cy="57.5" rx="5" ry="1.5" fill="#FFB300" opacity="0.5" />
  <circle cx="32" cy="57" r="1" fill="#FFF9C4" />

  <!-- Aperture Inner Lens -->
  <circle cx="32" cy="27" r="11" fill="#0C0E17" stroke="url(#favGold)" stroke-width="1.2" />
  <circle cx="32" cy="27" r="9.5" fill="none" stroke="#FF9800" stroke-width="0.6" stroke-dasharray="1 2" opacity="0.6" />

  <!-- 4-Point Faceted Compass Star -->
  <!-- North Point -->
  <polygon points="32,27 32,18 30,27" fill="url(#favNorthLight)" />
  <polygon points="32,27 32,18 34,27" fill="url(#favNorthDark)" />

  <!-- South Point -->
  <polygon points="32,27 32,36 34,27" fill="url(#favSouthLight)" />
  <polygon points="32,27 32,36 30,27" fill="url(#favSouthDark)" />

  <!-- East Point -->
  <polygon points="32,27 41,27 32,25" fill="url(#favEastLight)" />
  <polygon points="32,27 41,27 32,29" fill="url(#favEastDark)" />

  <!-- West Point -->
  <polygon points="32,27 23,27 32,29" fill="url(#favWestLight)" />
  <polygon points="32,27 23,27 32,25" fill="url(#favWestDark)" />

  <!-- Diagonal Star Accents (NE, SE, SW, NW) -->
  <polygon points="32,27 36,23 33,26" fill="#FFF9C4" opacity="0.8" />
  <polygon points="32,27 36,31 33,28" fill="#FF9800" opacity="0.8" />
  <polygon points="32,27 28,31 31,28" fill="#F4511E" opacity="0.8" />
  <polygon points="32,27 28,23 31,26" fill="#FFD54F" opacity="0.8" />

  <!-- Center Jewel Pivot -->
  <circle cx="32" cy="27" r="2.2" fill="url(#favGold)" />
  <circle cx="32" cy="27" r="1" fill="#FFFFFF" />
</svg>
